name: 取扱店舗の最終更新を見張る

on:
  schedule:
    - cron: "*/10 * * * *"   # 10 分おきの指定だが、GitHub が間引いて実際は約 1 時間おき（予備）。
                             # 主な起動は cron-job.org から 10 分おきに workflow_dispatch を呼ぶ（README 参照）
  workflow_dispatch:
    inputs:
      test:
        description: "変化がなくても今の状態を Discord に送る（動作確認）"
        type: boolean
        default: false   # 外（cron-job.org）から起こすときに毎回送らないよう、既定は「送らない」

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: 公式サイトを調べて通知する
        env:
          STORES: ${{ secrets.STORES }}   # 公開リポジトリのログに店名が出ないよう Secrets に入れる
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_ALL: ${{ secrets.DISCORD_WEBHOOK_URL_ALL }}   # 2 つ目のチャンネル（すべての更新）。なければ送らない
          MIN_GAP_HOURS: "36"   # 何時間以上ぶりの更新で知らせるか
          QUIET_START: "22"     # この時刻から
          QUIET_END: "8"        # この時刻までは通知をためて、朝にまとめて送る（日本時間）
          NOTIFY_TEST: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.test) == 'true' && '1' || '0' }}
        run: python3 watch.py

      - name: 状態を保存する
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            [ -f history.csv ] && git add history.csv
            git commit -m "状態を更新"
            git pull --rebase -q   # 途中でプログラムが更新されていても保存できるようにする
            git push
          fi
